
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string

      package_name:
        description: "Package Name (khusus Website), contoh com.mayzz.app"
        required: false
        type: string

      url:
        description: "URL Website (untuk Website to APK)"
        required: false
        type: string

      zip_url:
        description: "Direct Download URL ZIP (untuk ZIP to APK)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Build APK
        env:
          WEB_URL: ${{ inputs.url }}
          ZIP_URL: ${{ inputs.zip_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}

        run: |
          set -euo pipefail

          if [ -n "$ZIP_URL" ] && [ -n "$WEB_URL" ]; then
            echo "Error: Isi URL atau ZIP saja, jangan keduanya."
            exit 1
          fi

          if [ -n "$ZIP_URL" ]; then
            echo "Downloading Flutter project ZIP..."

            case "$ZIP_URL" in
              http://*|https://*) ;;
              *)
                echo "Error: Link ZIP harus menggunakan HTTP atau HTTPS."
                exit 1
                ;;
            esac

            curl --fail --location --retry 3 \
              --output project.zip "$ZIP_URL"

            if [ ! -s project.zip ]; then
              echo "Error: File ZIP kosong."
              exit 1
            fi

            mkdir -p source_code
            unzip -q project.zip -d source_code

            PUBSPEC_PATH=$(find "$GITHUB_WORKSPACE/source_code" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' -print -quit)

            if [ -z "$PUBSPEC_PATH" ]; then
              echo "Error: pubspec.yaml tidak ditemukan."
              echo "Pastikan ZIP berisi project Flutter."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")

            echo "Flutter project found: $PROJECT_DIR"

          elif [ -n "$WEB_URL" ]; then
            echo "Creating Website WebView APK..."

            case "$WEB_URL" in
              http://*|https://*) ;;
              *)
                echo "Error: URL harus menggunakan HTTP atau HTTPS."
                exit 1
                ;;
            esac

            if [[ ! "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
              echo "Error: Package name tidak valid."
              exit 1
            fi

            ORG="${PACKAGE_NAME%.*}"
            PROJECT_NAME="${PACKAGE_NAME##*.}"

            PROJECT_DIR="$GITHUB_WORKSPACE/web_app"

            flutter create \
              --org "$ORG" \
              --project-name "$PROJECT_NAME" \
              "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            sed -i '/^dependencies:/a\  webview_flutter: ^4.5.0' pubspec.yaml

            python3 - "$WEB_URL" "$PROJECT_DIR/lib/main.dart" <<'PY'
          import json
          import sys

          url = json.dumps(sys.argv[1])
          path = sys.argv[2]

          code = """
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatefulWidget {
            const MyApp({super.key});

            @override
            State<MyApp> createState() => _MyAppState();
          }

          class _MyAppState extends State<MyApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse(URL_VALUE));
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: controller),
                  ),
                ),
              );
            }
          }
          """.replace("URL_VALUE", url)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          PY

          else
            echo "Error: Masukkan URL website atau URL ZIP."
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "Getting Flutter dependencies..."
          flutter pub get

          echo "Building Release APK..."
          flutter build apk --release

          APK_PATH="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK tidak ditemukan."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "BUILD SUCCESS!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
          
