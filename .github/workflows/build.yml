
name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string

      package_name:
        description: "Package Name"
        required: false
        type: string
        default: "com.mayzz.app"

      url:
        description: "URL Website untuk Website to APK"
        required: false
        type: string

      zip_url:
        description: "Direct Download URL ZIP untuk ZIP to APK"
        required: false
        type: string

      tag:
        description: "Versi APK"
        required: false
        type: string
        default: "v1.0.0"

      build_type:
        description: "Jenis Build"
        required: true
        type: choice
        options:
          - website
          - zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Prepare Build
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEB_URL: ${{ inputs.url }}
          ZIP_URL: ${{ inputs.zip_url }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          if [ -z "$APP_NAME" ]; then
            echo "Nama aplikasi wajib diisi."
            exit 1
          fi

          if [ "$BUILD_TYPE" = "zip" ]; then

            if [ -z "$ZIP_URL" ] || [ -n "$WEB_URL" ]; then
              echo "Isi ZIP URL saja."
              exit 1
            fi

            case "$ZIP_URL" in
              http://*|https://*) ;;
              *)
                echo "URL ZIP tidak valid."
                exit 1
                ;;
            esac

            echo "Downloading ZIP..."

            curl --fail --location --retry 3 \
              --output project.zip "$ZIP_URL"

            mkdir -p source_code
            unzip -q project.zip -d source_code

            PUBSPEC_PATH=$(find "$GITHUB_WORKSPACE/source_code" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' -print -quit)

            if [ -z "$PUBSPEC_PATH" ]; then
              echo "pubspec.yaml tidak ditemukan."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")

          elif [ "$BUILD_TYPE" = "website" ]; then

            if [ -z "$WEB_URL" ] || [ -n "$ZIP_URL" ]; then
              echo "Isi Website URL saja."
              exit 1
            fi

            case "$WEB_URL" in
              http://*|https://*) ;;
              *)
                echo "URL Website tidak valid."
                exit 1
                ;;
            esac

            if [[ ! "$PACKAGE_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
              echo "Package Name tidak valid."
              exit 1
            fi

            ORG="${PACKAGE_NAME%.*}"
            PROJECT_NAME="${PACKAGE_NAME##*.}"

            PROJECT_DIR="$GITHUB_WORKSPACE/web_app"

            flutter create \
              --org "$ORG" \
              --project-name "$PROJECT_NAME" \
              "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            sed -i '/^dependencies:/a\  webview_flutter: ^4.5.0' pubspec.yaml

            python3 - "$WEB_URL" "$PROJECT_DIR/lib/main.dart" <<'PY'
          import json
          import sys

          url = json.dumps(sys.argv[1])
          path = sys.argv[2]

          code = """
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatefulWidget {
            const MyApp({super.key});

            @override
            State<MyApp> createState() => _MyAppState();
          }

          class _MyAppState extends State<MyApp> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..loadRequest(Uri.parse(URL_VALUE));
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }
          }
          """.replace("URL_VALUE", url)

          with open(path, "w", encoding="utf-8") as f:
              f.write(code)
          PY

          else
            echo "Jenis build tidak dikenal."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

          flutter build apk --release

          APK_PATH="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-release.apk"

          echo "BUILD SUCCESS!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ inputs.tag }}
          path: output/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
